<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Extractor</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
    .form-container { width: 50%; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); }
    h2 { text-align: center; }
    label { display: block; margin-top: 15px; }
    input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; }
    button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Upload Your Resume</h2>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <label for="resume">Choose PDF Resume:</label>
      <input type="file" id="resume" name="resume" accept=".pdf" required>
      <button type="submit">Extract Information</button>
    </form>
  </div>
</body>
</html>
